[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "stride-paper-figures"
version = "0.1.0"
description = "Presentation-only figures and tables for STRIDE"
requires-python = ">=3.10"
dependencies = [
  "adjustText>=0.8",
  "matplotlib>=3.7",
  "numpy>=1.24",
  "pandas>=2.0",
  "pyarrow>=12.0",
  "scipy>=1.10",
]

[project.optional-dependencies]
dev = ["pytest>=7", "ruff>=0.5"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
  "integration: requires archived STRIDE outputs and cross-repository artifacts",
]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I"]
