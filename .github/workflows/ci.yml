name: CI

on:
  push:
  pull_request:

jobs:
  self-contained:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install -e ".[dev]"
      - run: ruff check figure_config.py tests/external_data.py tests/test_source_config.py
      - name: Self-contained unit tests
        env:
          MPLBACKEND: Agg
        run: pytest -m "not integration" -q

  integration-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e ".[dev]"
      - name: Verify absent archives produce explicit skips
        env:
          MPLBACKEND: Agg
        run: pytest -m integration -q
